<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJUI Travel — Modo Mapa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0f; font-family: system-ui, sans-serif; }
  #map { width: 100%; height: 100vh; background: #bcdff2; }
  .topbar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .topbar input, .topbar button {
    padding: 10px 14px; border-radius: 10px; border: none; font-size: 14px;
  }
  .topbar input { width: 90px; text-transform: uppercase; }
  .topbar button { background: #f5a623; font-weight: bold; cursor: pointer; }
  .price-bubble {
    background: #f5a623; color: #111; font-weight: bold; border-radius: 999px;
    padding: 6px 10px; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    border: 2px solid #fff; white-space: nowrap;
  }
  .leaflet-popup-content-wrapper { background: #1e1e1e; color: #eee; border-radius: 10px; }
  .leaflet-popup-content a { color: #f5a623; }
  #status { position: absolute; bottom: 10px; left: 12px; z-index: 1000; color: #999; font-size: 12px; background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <input id="origin" list="airportList" value="Sevilla (SVQ)" placeholder="Ciudad o código (ej: Sevilla o SVQ)" style="width: 220px" />
  <datalist id="airportList"></datalist>
  <input id="month" type="month" />
  <input id="minPrice" type="number" placeholder="Precio mín €" style="width: 110px" />
  <input id="maxPrice" type="number" placeholder="Precio máx €" style="width: 110px" />
  <button onclick="buscar()">Explorar destinos (orientativo)</button>
  <div style="width:100%"></div>
  <input id="exactDep" type="date" title="Fecha de salida exacta" />
  <input id="exactRet" type="date" title="Fecha de vuelta exacta" />
  <button onclick="buscarFechasExactas()" style="background:#4caf50;">Buscar con fechas exactas (real)</button>
</div>
<div id="status">Escribe una ciudad o código de aeropuerto, elige el mes y pulsa buscar.</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const WORKER_URL = "https://tripper.grupoajui.workers.dev";

  // Coordenadas aproximadas de las principales ciudades/aeropuertos europeos

    // Europa
    { code: "SVQ", name: "Sevilla", country: "ES", lat: 37.418, lon: -5.893 },

    { code: "GVA", name: "Ginebra", country: "CH", lat: 46.204, lon: 6.143 },
    { code: "EDI", name: "Edimburgo", country: "GB", lat: 55.953, lon: -3.188 },
    { code: "MAN", name: "Mánchester", country: "GB", lat: 53.483, lon: -2.244 },

    // Norteamérica
    { code: "NYC", name: "Nueva York", country: "US", lat: 40.713, lon: -74.006 },

    { code: "MEX", name: "Ciudad de México", country: "MX", lat: 19.433, lon: -99.133 },
    { code: "CUN", name: "Cancún", country: "MX", lat: 21.161, lon: -86.851 },
    // Sudamérica
    { code: "BOG", name: "Bogotá", country: "CO", lat: 4.711, lon: -74.072 },
    { code: "LIM", name: "Lima", country: "PE", lat: -12.046, lon: -77.043 },
    { code: "SCL", name: "Santiago de Chile", country: "CL", lat: -33.449, lon: -70.669 },
    { code: "BUE", name: "Buenos Aires", country: "AR", lat: -34.604, lon: -58.382 },
    { code: "RIO", name: "Río de Janeiro", country: "BR", lat: -22.907, lon: -43.173 },
    // Asia
    { code: "DXB", name: "Dubái", country: "AE", lat: 25.204, lon: 55.271 },
    { code: "DOH", name: "Doha", country: "QA", lat: 25.286, lon: 51.534 },
    { code: "BKK", name: "Bangkok", country: "TH", lat: 13.756, lon: 100.502 },
    { code: "SIN", name: "Singapur", country: "SG", lat: 1.352, lon: 103.820 },
    { code: "HKG", name: "Hong Kong", country: "HK", lat: 22.319, lon: 114.169 },
    { code: "TYO", name: "Tokio", country: "JP", lat: 35.676, lon: 139.650 },
    { code: "SEL", name: "Seúl", country: "KR", lat: 37.566, lon: 126.978 },
    { code: "DEL", name: "Delhi", country: "IN", lat: 28.704, lon: 77.102 },
    { code: "BOM", name: "Bombay", country: "IN", lat: 19.076, lon: 72.878 },
    { code: "KUL", name: "Kuala Lumpur", country: "MY", lat: 3.140, lon: 101.687 },
    { code: "MNL", name: "Manila", country: "PH", lat: 14.599, lon: 120.984 },
    // Oceanía
    { code: "SYD", name: "Sídney", country: "AU", lat: -33.868, lon: 151.209 },
    { code: "MEL", name: "Melbourne", country: "AU", lat: -37.813, lon: 144.963 },
    { code: "AKL", name: "Auckland", country: "NZ", lat: -36.848, lon: 174.763 },
    // África
    { code: "CAI", name: "El Cairo", country: "EG", lat: 30.044, lon: 31.235 },
    { code: "CMN", name: "Casablanca", country: "MA", lat: 33.573, lon: -7.589 },
    { code: "JNB", name: "Johannesburgo", country: "ZA", lat: -26.204, lon: 28.047 },
    { code: "NBO", name: "Nairobi", country: "KE", lat: -1.286, lon: 36.816 },
    { code: "DKR", name: "Dakar", country: "SN", lat: 14.716, lon: -17.467 },
    { code: "RAK", name: "Marrakech", country: "MA", lat: 31.629, lon: -7.981 },
  ];

  // Índice rápido por código, para pintar los destinos
  const AIRPORTS_BY_CODE = {};
  AIRPORTS.forEach(a => { AIRPORTS_BY_CODE[a.code] = a; });

  function formatDateEs(isoDate) {
    if (!isoDate) return '-';
    const [y, m, d] = isoDate.slice(0, 10).split('-');
    return `${d}-${m}-${y}`;
  }
  function flagImgTag(iso2, size = 16) {
    if (!iso2) return '';
    return `<img src="https://flagcdn.com/24x18/${iso2.toLowerCase()}.png" width="${size}" style="vertical-align: middle; border-radius: 2px; margin-right: 3px;" />`;
  }

  // Rellenar el autocompletado (datalist) con "Ciudad (CODIGO)"
  const datalist = document.getElementById('airportList');
  AIRPORTS.forEach(a => {
    const opt = document.createElement('option');
    opt.value = `${a.name} (${a.code})`;
    datalist.appendChild(opt);
  });

  // Convierte lo que el usuario haya escrito (ciudad o código) en un IATA válido
  function resolveOriginInput(raw) {
    const text = raw.trim();
    if (!text) return null;

    // Si escribió "Ciudad (COD)" del autocompletado, extraemos el código
    const match = text.match(/\(([A-Z]{3})\)\s*$/i);
    if (match) return match[1].toUpperCase();

    // Si escribió directamente un código de 3 letras
    if (/^[A-Za-z]{3}$/.test(text)) return text.toUpperCase();

    // Si escribió el nombre de la ciudad (sin acentos, sin mayúsculas)
    const normalize = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const found = AIRPORTS.find(a => normalize(a.name) === normalize(text));
    return found ? found.code : null;
  }

  const map = L.map('map', {
    zoomControl: false,
    worldCopyJump: false,
    maxBounds: [[-85, -180], [85, 180]],
    maxBoundsViscosity: 1.0,
    minZoom: 2,
  }).setView([20, 10], 2);

  L.control.zoom({ position: 'topright' }).addTo(map);

  // Mapa de baldosas ya diseñado (CartoDB Positron sin etiquetas) — al ser
  // geografía real, incluye todas las islas correctamente, a diferencia del
  // contorno simplificado que probamos antes.
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
    noWrap: true,
  }).addTo(map);

  let markers = [];
  let lastOrigin = null;
  const status = document.getElementById('status');

  function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function priceIcon(price, countryCode) {
    return L.divIcon({
      className: '',
      html: `<div class="price-bubble">${flagImgTag(countryCode)}${Math.round(price)}€</div>`,
      iconSize: [70, 30],
    });
  }

  async function buscar() {
    const rawInput = document.getElementById('origin').value;
    const origin = resolveOriginInput(rawInput);
    const month = document.getElementById('month').value; // "2026-09" o vacío

    if (!origin) {
      status.textContent = 'No reconozco esa ciudad/código. Elige una opción de la lista o escribe un código IATA (ej: SVQ).';
      return;
    }

    lastOrigin = origin;
    await escanearMundo({ origin, departureDate: month || undefined, returnDate: undefined, modoLabel: 'orientativo' });
  }

  async function buscarFechasExactas() {
    const rawInput = document.getElementById('origin').value;
    const origin = resolveOriginInput(rawInput);
    const depDate = document.getElementById('exactDep').value;
    const retDate = document.getElementById('exactRet').value;

    if (!origin) {
      status.textContent = 'No reconozco esa ciudad/código de origen.';
      return;
    }
    if (!depDate || !retDate) {
      status.textContent = 'Elige fecha de salida y de vuelta exactas arriba.';
      return;
    }

    lastOrigin = origin;
    await escanearMundo({ origin, departureDate: depDate, returnDate: retDate, modoLabel: 'confirmado' });
  }

  // Motor común: recorre TODOS los aeropuertos del mundo de nuestra tabla,
  // uno a uno (en tandas), consultando el precio real de esa ruta concreta.
  // Así no dependemos de "lo más buscado por otros" (que siempre es Europa
  // desde un aeropuerto pequeño), sino que preguntamos nosotros mismos por
  // cada destino del mundo.
  async function escanearMundo({ origin, departureDate, returnDate, modoLabel }) {
    clearMarkers();
    const candidates = AIRPORTS.filter(a => a.code !== origin);
    const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
    const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
    const BATCH_SIZE = 6;
    let checked = 0;
    let found = 0;

    for (let i = 0; i < candidates.length; i += BATCH_SIZE) {
      const batch = candidates.slice(i, i + BATCH_SIZE);
      status.textContent = `Escaneando el mundo (${modoLabel})... ${checked}/${candidates.length} destinos revisados, ${found} encontrados.`;

      await Promise.all(batch.map(async (airport) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/flights/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ origin, destination: airport.code, departureDate, returnDate }),
          });
          const data = await res.json();
          const destData = data?.raw?.data?.[airport.code];
          const first = destData ? Object.values(destData)[0] : null;
          checked++;
          if (!first) return;
          if (first.price < minPrice || first.price > maxPrice) return;

          found++;
          pintarDestino(airport, first, departureDate, returnDate);
        } catch (e) {
          checked++;
        }
      }));
    }

    status.textContent = `Escaneo mundial terminado (${modoLabel}): ${found} destinos con precio real (de ${candidates.length} comprobados en todo el mundo).`;
  }

  function pintarDestino(airport, first, departureDate, returnDate) {
    const dest = airport.code;
    const depReal = first.departure_at ? first.departure_at.slice(0, 10) : (departureDate || '-');
    const retReal = first.return_at ? first.return_at.slice(0, 10) : (returnDate || '');
    const marker = L.marker([airport.lat, airport.lon], { icon: priceIcon(first.price, airport.country) }).addTo(map);

    const checkIn = depReal;
    const checkOut = retReal || depReal; // si no hay vuelta, al menos no rompemos el link de hoteles
    const bookingUrl = `https://www.booking.com/searchresults.html?ss=${encodeURIComponent(airport.name)}&checkin=${checkIn}&checkout=${checkOut}&nflt=class%3D4%3Bclass%3D5&lang=es&selected_currency=EUR`;

    marker.bindPopup(`
      <b>${flagImgTag(airport.country, 20)}${airport.name} (${dest})</b><br>
      <b>Vuelo: ${first.price}€</b> ${retReal ? '(ida+vuelta)' : '(solo ida, orientativo)'}<br>
      Salida: ${formatDateEs(depReal)}${retReal ? ' · Vuelta: ' + formatDateEs(retReal) : ''}<br>
      <a href="${bookingUrl}" target="_blank">Ver hoteles 4★+ en ${airport.name} →</a><br>
      <small>El precio del alojamiento no se muestra aquí dentro porque no tenemos (todavía) una API de hoteles con precio real gratuita aprobada — el link ya te lleva con las fechas puestas.</small>
    `);
    markers.push(marker);
  }

  buscar();

  async function calcReturn(dest) {
    const depInput = document.getElementById(`dep-${dest}`);
    const retInput = document.getElementById(`ret-${dest}`);
    const resultEl = document.getElementById(`result-${dest}`);

    const depOnly = depInput.value;
    const returnDate = retInput.value;

    if (!depOnly || !returnDate) {
      resultEl.textContent = 'Elige fecha de salida y de vuelta.';
      return;
    }

    resultEl.textContent = 'Comprobando disponibilidad y precio real...';

    try {
      const res = await fetch(`${WORKER_URL}/api/flights/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ origin: lastOrigin, destination: dest, departureDate: depOnly, returnDate }),
      });
      const data = await res.json();
      const destData = data?.raw?.data?.[dest];
      const first = destData ? Object.values(destData)[0] : null;

      if (!first) {
        resultEl.textContent = `Sin vuelos encontrados para esas fechas exactas. Prueba con otras fechas cercanas.`;
        return;
      }

      // Skyscanner: formato de URL fiable y documentado (fechas en YYMMDD)
      const toYYMMDD = (iso) => iso.slice(2, 4) + iso.slice(5, 7) + iso.slice(8, 10);
      const skyscannerUrl = `https://www.skyscanner.es/transport/flights/${lastOrigin.toLowerCase()}/${dest.toLowerCase()}/${toYYMMDD(depOnly)}/${toYYMMDD(returnDate)}/?adults=1&cabinclass=economy&rtn=1&currency=EUR&locale=es-ES`;

      resultEl.innerHTML = `
        <b>Ida+vuelta: ${first.price}€</b><br>
        Salida: ${formatDateEs(depOnly)} · Vuelta: ${formatDateEs(returnDate)}<br>
        <a href="${skyscannerUrl}" target="_blank">Comprobar y comprar en Skyscanner →</a>
      `;
    } catch (err) {
      resultEl.textContent = 'Error al calcular: ' + err;
    }
  }
</script>
</body>
</html>
