<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJUI Travel — Modo Mapa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin: 0; background: #0b0b0f; font-family: system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  #map { flex: 1 1 auto; width: 100%; background: #bcdff2; min-height: 60vh; position: relative; overflow: hidden; }
  .topbar {
    flex: 0 0 auto;
    position: relative;
    background: #0b0b0f;
    padding: 10px;
    display: flex; gap: 6px; flex-wrap: wrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
    z-index: 1000;
  }
  .topbar input, .topbar button {
    padding: 9px 10px; border-radius: 8px; border: none; font-size: 13px;
  }
  .topbar input { width: 100px; flex: 1 1 90px; min-width: 80px; }
  .topbar button { background: #f5a623; font-weight: bold; cursor: pointer; flex: 1 1 100%; }
  .price-bubble {
    background: #f5a623; color: #111; font-weight: bold; border-radius: 999px;
    padding: 6px 10px; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    border: 2px solid #fff; white-space: nowrap;
  }
  .leaflet-popup-content-wrapper { background: #1e1e1e; color: #eee; border-radius: 10px; }
  .leaflet-popup-content a { color: #f5a623; }
  #status { flex: 0 0 auto; color: #999; font-size: 12px; background: #0b0b0f; padding: 6px 10px; }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <input id="origin" list="airportList" value="Sevilla (SVQ)" placeholder="Ciudad o código (ej: Sevilla o SVQ)" />
    <datalist id="airportList"></datalist>
    <input id="month" type="month" />
    <input id="minPrice" type="number" placeholder="Precio mín €" />
    <input id="maxPrice" type="number" placeholder="Precio máx €" />
    <input id="personas" type="number" placeholder="Nº personas" value="1" min="1" />
    <button onclick="buscar()">Buscar destinos (mundo)</button>
    <input id="minNights" type="number" placeholder="Noches mín" />
    <input id="maxNights" type="number" placeholder="Noches máx" />
  </div>
  <div id="status">Escribe una ciudad o código de aeropuerto, elige el mes y pulsa buscar.</div>
  <div id="map"></div>
</div>

    { code: "RAK", name: "Marrakech", country: "MA", lat: 31.629, lon: -7.981 },
  ];

  // Índice rápido por código, para pintar los destinos
  const AIRPORTS_BY_CODE = {};
  AIRPORTS.forEach(a => { AIRPORTS_BY_CODE[a.code] = a; });

  function formatDateEs(isoDate) {
    if (!isoDate) return '-';
    const [y, m, d] = isoDate.slice(0, 10).split('-');
    return `${d}-${m}-${y}`;
  }
  function flagImgTag(iso2, size = 16) {
    if (!iso2) return '';
    return `<img src="https://flagcdn.com/24x18/${iso2.toLowerCase()}.png" width="${size}" style="vertical-align: middle; border-radius: 2px; margin-right: 3px;" />`;
  }

  // Rellenar el autocompletado (datalist) con "Ciudad (CODIGO)"
  const datalist = document.getElementById('airportList');
  AIRPORTS.forEach(a => {
    const opt = document.createElement('option');
    opt.value = `${a.name} (${a.code})`;
    datalist.appendChild(opt);
  });

  // Convierte lo que el usuario haya escrito (ciudad o código) en un IATA válido
  function resolveOriginInput(raw) {
    const text = raw.trim();
    if (!text) return null;

    // Si escribió "Ciudad (COD)" del autocompletado, extraemos el código
    const match = text.match(/\(([A-Z]{3})\)\s*$/i);
    if (match) return match[1].toUpperCase();

    // Si escribió directamente un código de 3 letras
    if (/^[A-Za-z]{3}$/.test(text)) return text.toUpperCase();

    // Si escribió el nombre de la ciudad (sin acentos, sin mayúsculas)
    const normalize = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const found = AIRPORTS.find(a => normalize(a.name) === normalize(text));
    return found ? found.code : null;
  }

  const map = L.map('map', {
    zoomControl: false,
    worldCopyJump: false,
    maxBounds: [[-85, -180], [85, 180]],
    maxBoundsViscosity: 1.0,
    minZoom: 2,
  }).setView([20, 10], 2);

  L.control.zoom({ position: 'topright' }).addTo(map);

  // Mapa de baldosas ya diseñado (CartoDB Positron sin etiquetas) — al ser
  // geografía real, incluye todas las islas correctamente, a diferencia del
  // contorno simplificado que probamos antes.
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
    noWrap: true,
  }).addTo(map);

  let markers = [];
  let lastOrigin = null;
  const status = document.getElementById('status');

  function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function priceIcon(price, countryCode) {
    return L.divIcon({
      className: '',
      html: `<div class="price-bubble">${flagImgTag(countryCode)}${Math.round(price)}€</div>`,
      iconSize: [70, 30],
    });
  }

  async function buscar() {
    const rawInput = document.getElementById('origin').value;
    const origin = resolveOriginInput(rawInput);
    const month = document.getElementById('month').value; // "2026-09" o vacío

    if (!origin) {
      status.textContent = 'No reconozco esa ciudad/código. Elige una opción de la lista o escribe un código IATA (ej: SVQ).';
      return;
    }

    lastOrigin = origin;
    await escanearMundo({ origin, departureDate: month || undefined, returnDate: month || undefined });
  }

  // Motor común: recorre TODOS los aeropuertos del mundo de nuestra tabla,
  // uno a uno (en tandas), consultando el precio real de esa ruta concreta.
  // Así no dependemos de "lo más buscado por otros" (que siempre es Europa
  // desde un aeropuerto pequeño), sino que preguntamos nosotros mismos por
  // cada destino del mundo.
  async function escanearMundo({ origin, departureDate, returnDate }) {
    clearMarkers();
    const candidates = AIRPORTS.filter(a => a.code !== origin);
    const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
    const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
    const minNights = parseInt(document.getElementById('minNights').value);
    const maxNights = parseInt(document.getElementById('maxNights').value);
    const hasNightsFilter = !isNaN(minNights) || !isNaN(maxNights);
    const BATCH_SIZE = 6;
    let checked = 0;
    let found = 0;

    for (let i = 0; i < candidates.length; i += BATCH_SIZE) {
      const batch = candidates.slice(i, i + BATCH_SIZE);
      status.textContent = `Escaneando el mundo... ${checked}/${candidates.length} destinos revisados, ${found} encontrados.`;

      await Promise.all(batch.map(async (airport) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/flights/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ origin, destination: airport.code, departureDate, returnDate }),
          });
          const data = await res.json();
          const destData = data?.raw?.data?.[airport.code];
          const first = destData ? Object.values(destData)[0] : null;
          checked++;
          if (!first) return;
          const personas = parseInt(document.getElementById('personas').value) || 1;
          const totalPrice = first.price * personas;
          if (totalPrice < minPrice || totalPrice > maxPrice) return;

          if (hasNightsFilter) {
            if (!first.departure_at || !first.return_at) return; // sin vuelta, no podemos saber las noches
            const nights = Math.round((new Date(first.return_at) - new Date(first.departure_at)) / 86400000);
            if (!isNaN(minNights) && nights < minNights) return;
            if (!isNaN(maxNights) && nights > maxNights) return;
          }

          found++;
          pintarDestino(airport, first, departureDate, returnDate);
        } catch (e) {
          checked++;
        }
      }));
    }

    status.textContent = `Escaneo mundial terminado: ${found} destinos encontrados (de ${candidates.length} comprobados en todo el mundo).`;
  }

  function pintarDestino(airport, first, departureDate, returnDate) {
    const dest = airport.code;
    const depReal = first.departure_at ? first.departure_at.slice(0, 10) : (departureDate || '-');
    const retReal = first.return_at ? first.return_at.slice(0, 10) : (returnDate || '');
    const personas = parseInt(document.getElementById('personas').value) || 1;
    const marker = L.marker([airport.lat, airport.lon], { icon: priceIcon(first.price * personas, airport.country) }).addTo(map);

    const checkIn = depReal;
    const checkOut = retReal || depReal;
    // review_score=80 = valoración de clientes 8+/10 (equivalente aprox. a "4 estrellas" de opinión,
    // que es distinto de la categoría oficial del hotel). El baño privado no tiene un código de
    // URL fiable/documentado en Booking, así que lo recordamos como aviso en vez de arriesgar un filtro roto.
    const bookingUrl = `https://www.booking.com/searchresults.html?ss=${encodeURIComponent(airport.name)}&checkin=${checkIn}&checkout=${checkOut}&group_adults=${personas}&no_rooms=1&nflt=review_score%3D80&lang=es&selected_currency=EUR`;

    let skyscannerLink = '';
    if (depReal && depReal !== '-' && /^\d{4}-\d{2}-\d{2}$/.test(depReal)) {
      const toYYMMDD = (iso) => iso.slice(2, 4) + iso.slice(5, 7) + iso.slice(8, 10);
      const retPart = (retReal && /^\d{4}-\d{2}-\d{2}$/.test(retReal)) ? `${toYYMMDD(retReal)}/` : '';
      const skyscannerUrl = `https://www.skyscanner.es/transport/flights/${lastOrigin.toLowerCase()}/${dest.toLowerCase()}/${toYYMMDD(depReal)}/${retPart}?adults=${personas}&cabinclass=economy&currency=EUR&locale=es-ES`;
      skyscannerLink = `<a href="${skyscannerUrl}" target="_blank">Ver/comprar vuelo en Skyscanner →</a><br>`;
    }

    // Estimación MUY aproximada de alojamiento (no es un precio real, no tenemos API de hoteles
    // con precio gratuita) — solo para hacerte una idea, siempre verifica en el link de Booking.
    const HOTEL_NIGHT_ESTIMATE = 90; // € por habitación y noche, cifra genérica orientativa
    let nights = null;
    if (first.departure_at && first.return_at) {
      nights = Math.round((new Date(first.return_at) - new Date(first.departure_at)) / 86400000);
    }
    const flightsTotal = first.price * personas;
    const hotelEstimate = nights ? HOTEL_NIGHT_ESTIMATE * nights : null;
    const grandTotal = hotelEstimate ? flightsTotal + hotelEstimate : null;

    marker.bindPopup(`
      <b>${flagImgTag(airport.country, 20)}${airport.name} (${dest})</b><br>
      Vuelos (${personas} ${personas === 1 ? 'persona' : 'personas'}): <b>${flightsTotal.toFixed(0)}€</b> ${retReal ? '(ida+vuelta)' : '(solo ida, orientativo)'}<br>
      Salida: ${formatDateEs(depReal)}${retReal ? ' · Vuelta: ' + formatDateEs(retReal) : ''}<br>
      ${hotelEstimate ? `Alojamiento (estimación MUY aproximada, ${nights} noches): ~${hotelEstimate}€<br><b>Total aproximado del viaje: ~${grandTotal.toFixed(0)}€</b><br>` : ''}
      ${skyscannerLink}
      <a href="${bookingUrl}" target="_blank">Ver hoteles con 8+/10 en ${airport.name} →</a><br>
      <small>⚠️ Marca "baño privado" tú mismo al llegar a Booking — ese filtro concreto no tiene un código de enlace fiable. El precio de alojamiento de arriba es una estimación genérica, no un dato real.</small>
    `);
    markers.push(marker);
  }

  buscar();

  async function calcReturn(dest) {
    const depInput = document.getElementById(`dep-${dest}`);
    const retInput = document.getElementById(`ret-${dest}`);
    const resultEl = document.getElementById(`result-${dest}`);

    const depOnly = depInput.value;
    const returnDate = retInput.value;

    if (!depOnly || !returnDate) {
      resultEl.textContent = 'Elige fecha de salida y de vuelta.';
      return;
    }

    resultEl.textContent = 'Comprobando disponibilidad y precio real...';

    try {
      const res = await fetch(`${WORKER_URL}/api/flights/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ origin: lastOrigin, destination: dest, departureDate: depOnly, returnDate }),
      });
      const data = await res.json();
      const destData = data?.raw?.data?.[dest];
      const first = destData ? Object.values(destData)[0] : null;

      if (!first) {
        resultEl.textContent = `Sin vuelos encontrados para esas fechas exactas. Prueba con otras fechas cercanas.`;
        return;
      }

      // Skyscanner: formato de URL fiable y documentado (fechas en YYMMDD)
      const toYYMMDD = (iso) => iso.slice(2, 4) + iso.slice(5, 7) + iso.slice(8, 10);
      const skyscannerUrl = `https://www.skyscanner.es/transport/flights/${lastOrigin.toLowerCase()}/${dest.toLowerCase()}/${toYYMMDD(depOnly)}/${toYYMMDD(returnDate)}/?adults=1&cabinclass=economy&rtn=1&currency=EUR&locale=es-ES`;

      resultEl.innerHTML = `
        <b>Ida+vuelta: ${first.price}€</b><br>
        Salida: ${formatDateEs(depOnly)} · Vuelta: ${formatDateEs(returnDate)}<br>
        <a href="${skyscannerUrl}" target="_blank">Comprobar y comprar en Skyscanner →</a>
      `;
    } catch (err) {
      resultEl.textContent = 'Error al calcular: ' + err;
    }
  }
</script>
</body>
